name: Test mobile reader

on:
  pull_request:
    paths:
      - 'index.html'
      - 'Ordinary Miracle.html'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/mobile-reader-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser test
        run: npm run test:mobile

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reader-test-results
          path: test-results/
          if-no-files-found: ignore
