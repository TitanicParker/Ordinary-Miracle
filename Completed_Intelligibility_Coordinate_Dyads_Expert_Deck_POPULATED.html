 s.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{audit[r.number]=b.dataset.rho;localStorage.setItem(storeKey,JSON.stringify(audit));s.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));});
 track.appendChild(s);
});
let index=0;const slides=[...document.querySelectorAll('.slide')],counter=document.getElementById('counter');
function go(i){index=Math.max(0,Math.min(53,i));slides[index].scrollIntoView({behavior:'smooth',inline:'start'});counter.textContent=`${index+1} / 54`;}
track.addEventListener('scroll',()=>requestAnimationFrame(()=>{index=Math.round(track.scrollLeft/track.clientWidth);counter.textContent=`${index+1} / 54`;}),{passive:true});
document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);document.getElementById('first').onclick=()=>go(0);document.getElementById('random').onclick=()=>go(Math.floor(Math.random()*54));
window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}});
document.getElementById('export').onclick=()=>{const rows=records.map(r=>({number:r.number2,compact_address:`${workCode[r.work]} / ${orientationCode[r.orientation]} / ${survivorCode[r.survivor]}`,coordinate:r.coordinate,canonical_name:r.canonical_name,companion_utterance:r.utterance,rho_relation:audit[r.number]||'',coordinate_convergence:'',notes:''}));const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='coordinate-dyad-audit.json';a.click();URL.revokeObjectURL(a.href);};
</script></body></html>
